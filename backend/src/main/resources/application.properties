server.port=8080

# Application Name
spring.application.name=shopsense-backend

# Database Configuration (Embedded DB with MySQL mode fallback, overridable via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:shopsense_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=9a2f8c7d6e5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e9d8c7b6a5f4e3d2c1b0a9f
app.jwt.expiration-ms=86400000

# Swagger OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Review Refresh Scheduler Configuration (Default: Every Sunday at 2:00 AM / ~7 days)
shopsense.reviews.refresh-cron=${SHOPSENSE_REVIEWS_REFRESH_CRON:0 0 2 * * SUN}
shopsense.reviews.refresh-interval-ms=${SHOPSENSE_REVIEWS_REFRESH_INTERVAL_MS:604800000}

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:mock-key-for-dev}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent}

